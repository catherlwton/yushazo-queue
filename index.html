<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commission by yushazo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Mitr', sans-serif; }
    </style>
</head>
<body class="bg-pink-50/50 text-gray-700 min-h-screen py-8 px-4">

    <!-- แถบเครื่องมือสำหรับเจ้าของร้าน (จะซ่อนอัตโนมัติเมื่อลูกค้าเปิด) -->
    <div id="admin-tools" class="max-w-xl mx-auto flex justify-between items-center mb-4">
        <span class="text-xs font-bold text-pink-500 bg-white px-3 py-1 rounded-full border border-pink-100 shadow-sm">
            👑 โหมดเจ้าของร้าน
        </span>
        <button onclick="copyCustomerLink()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-medium px-3.5 py-1.5 rounded-xl shadow-sm transition flex items-center gap-1.5">
            <i class="fa-solid fa-copy"></i> คัดลอกลิงก์ส่งให้ลูกค้า
        </button>
    </div>

    <!-- ป้ายเตือนสำหรับลูกค้า -->
    <div id="customer-badge" class="hidden max-w-xl mx-auto text-center mb-4">
        <span class="text-xs text-pink-400 bg-white/80 px-3 py-1 rounded-full border border-pink-100">
            🌷 มุมมองลูกค้า (ดูคิวงานเท่านั้น)
        </span>
    </div>

    <div class="max-w-xl mx-auto space-y-4">

        <!-- 1. HEADER CARD -->
        <div class="bg-white rounded-2xl p-6 text-center border-2 border-pink-100 shadow-sm relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-16 h-16 bg-pink-100/50 rounded-full blur-xl"></div>
            <h1 class="text-xl font-bold text-pink-500 tracking-wide">Commission by yushazo</h1>
            <p class="text-sm text-pink-400 mt-1">Welcome & Thank you 🌷</p>
        </div>

        <!-- 2. ARTIST NOTE CARD -->
        <div class="bg-white rounded-2xl p-5 border-2 border-pink-100 shadow-sm space-y-3 relative">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-gray-800 text-base flex items-center gap-2">
                    📢 Artist Note
                </h2>
                <!-- ปุ่มกดแก้ไข Note (โชว์เฉพาะ Admin) -->
                <button id="admin-edit-note-btn" onclick="editArtistNote()" class="text-xs text-pink-500 hover:text-pink-600 font-medium bg-pink-50 px-2.5 py-1 rounded-lg border border-pink-100 transition">
                    ✏️ แก้ไขข้อความ
                </button>
            </div>
            
            <div id="artist-note-content" class="space-y-2 text-xs md:text-sm text-gray-600 pl-1">
                <!-- ข้อความส่วนนี้จะถูกโหลดจากสคริปต์ -->
            </div>
        </div>

        <!-- แท็บสลับหน้า -->
        <div id="admin-tabs" class="bg-white/80 p-1.5 rounded-xl border border-pink-100 flex gap-2">
            <button onclick="switchTab('my-jobs')" id="tab-my-jobs" class="flex-1 py-1.5 text-xs font-medium rounded-lg bg-pink-400 text-white shadow-sm">
                🎨 คิวที่เราต้องวาด (ลูกค้าจ้างเรา)
            </button>
            <button onclick="switchTab('hired-jobs')" id="tab-hired-jobs" class="flex-1 py-1.5 text-xs font-medium rounded-lg text-gray-500 hover:bg-white">
                🛍️ คิวที่เราไปจ้างคนอื่น
            </button>
        </div>

        <!-- ================= SELLER VIEW (คิวงานของเรา) ================= -->
        <div id="seller-section" class="space-y-4">
            <!-- SEARCH QUEUE -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-pink-300 text-sm"></i>
                <input type="text" id="search-input" oninput="render()" placeholder="🔎 Search Queue (ค้นหาชื่อลูกค้า/เลขคิว...)" 
                    class="w-full pl-10 pr-4 py-2.5 bg-white border-2 border-pink-100 rounded-xl text-sm focus:outline-none focus:border-pink-300 placeholder-pink-300 shadow-sm">
            </div>

            <!-- QUEUE GRID -->
            <div id="queue-grid" class="grid grid-cols-2 gap-3"></div>

            <!-- ปุ่มเพิ่มคิว -->
            <div id="admin-add-btn" class="text-center pt-2">
                <button onclick="toggleAddModal()" class="bg-pink-400 hover:bg-pink-500 text-white font-medium px-6 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-plus"></i> เพิ่มคิวงานใหม่
                </button>
            </div>
        </div>

        <!-- ================= BUYER VIEW (งานที่เราไปจ้างคนอื่น) ================= -->
        <div id="buyer-section" class="hidden space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-sm font-bold text-gray-700">รายชื่อที่เราไปสั่งวาดไว้</h3>
                <button onclick="addBuyerJob()" class="text-xs bg-indigo-400 text-white px-3 py-1.5 rounded-lg">＋ บันทึกงานจ้าง</button>
            </div>
            <div id="buyer-list" class="space-y-2"></div>
        </div>

    </div>

    <!-- MODAL POPUP: เพิ่มคิวใหม่ -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
            <h3 class="font-bold text-gray-800 text-center border-b pb-2">＋ เพิ่มคิวงานใหม่</h3>
            <form onsubmit="addNewQueue(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-gray-600 mb-1">ชื่อลูกค้า (เช่น @Alice)</label>
                    <input type="text" id="add-customer" required class="w-full border rounded-lg p-2 focus:outline-pink-400">
                </div>
                <div>
                    <label class="block text-gray-600 mb-1">ประเภทงาน (เช่น Half Body / Chibi)</label>
                    <input type="text" id="add-type" required class="w-full border rounded-lg p-2 focus:outline-pink-400">
                </div>
                <div>
                    <label class="block text-gray-600 mb-1">สถานะงาน</label>
                    <select id="add-status" class="w-full border rounded-lg p-2 focus:outline-pink-400">
                        <option value="🩷 รอคิว">🩷 รอคิว</option>
                        <option value="💜 กำลังทำ">💜 กำลังทำ</option>
                        <option value="✨ เสร็จแล้ว">✨ เสร็จแล้ว</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 mb-1">ความคืบหน้า (%)</label>
                    <input type="number" id="add-progress" min="0" max="100" value="0" required class="w-full border rounded-lg p-2 focus:outline-pink-400">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="toggleAddModal()" class="flex-1 bg-gray-100 py-2 rounded-lg text-gray-600">ยกเลิก</button>
                    <button type="submit" class="flex-1 bg-pink-400 text-white py-2 rounded-lg font-medium">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isCustomer = urlParams.get('view') === 'customer';

        // ฐานข้อมูลเริ่มต้น
        let defaultData = {
            notes: [
                "🌸 ทำงานวัน พุธ อาทิตย์",
                "🎨 เวลาทำงาน : 20.00-01.00",
                "💌 งานเส้นรัฟมาก ๆ ไม่เก็บรายละเอียดเลย",
                "📅 อัปเดตคิวในนี้ทุก ๆ วันอาทิตย์"
            ],
            seller: [
                { id: 1, queueNum: '01', name: '@Alice', type: 'Half Body', progress: 60, status: '💜 กำลังทำ' },
                { id: 2, queueNum: '02', name: '@Mika', type: 'Chibi', progress: 20, status: '🩷 รอคิว' }
            ],
            buyer: [
                { id: 101, artist: '@Artist_A', type: 'Full Scale', status: 'รอสเก็ตช์' }
            ]
        };

        if (!localStorage.getItem('yushazo_db')) {
            localStorage.setItem('yushazo_db', JSON.stringify(defaultData));
        }

        function getDB() { 
            let db = JSON.parse(localStorage.getItem('yushazo_db'));
            if(!db.notes) db.notes = defaultData.notes; // กันข้อมูลเก่าไม่มี notes
            return db;
        }
        function saveDB(db) { localStorage.setItem('yushazo_db', JSON.stringify(db)); render(); }

        // ฟังก์ชันแก้ไข Artist Note
        function editArtistNote() {
            if(isCustomer) return;
            const db = getDB();
            const currentNotes = db.notes.join('\n');
            const newNotesText = prompt("แก้ไข Artist Note (ขึ้นบรรทัดใหม่เพื่อแยกข้อความ):", currentNotes);
            
            if(newNotesText !== null) {
                db.notes = newNotesText.split('\n').filter(line => line.trim() !== '');
                saveDB(db);
            }
        }

        function copyCustomerLink() {
            const baseUrl = window.location.href.split('?')[0];
            const customerUrl = `${baseUrl}?view=customer`;
            navigator.clipboard.writeText(customerUrl);
            alert("คัดลอกลิงก์เรียบร้อยแล้ว! นำลิงก์นี้ไปส่งให้ลูกค้าได้เลยครับ");
        }

        function toggleAddModal() {
            if(isCustomer) return;
            document.getElementById('add-modal').classList.toggle('hidden');
        }

        function addNewQueue(e) {
            e.preventDefault();
            if(isCustomer) return;
            const db = getDB();
            const nextNum = String(db.seller.length + 1).padStart(2, '0');
            
            db.seller.push({
                id: Date.now(),
                queueNum: nextNum,
                name: document.getElementById('add-customer').value,
                type: document.getElementById('add-type').value,
                status: document.getElementById('add-status').value,
                progress: Number(document.getElementById('add-progress').value)
            });

            saveDB(db);
            toggleAddModal();
            e.target.reset();
        }

        function deleteQueue(id) {
            if(isCustomer) return;
            if(confirm("ต้องการลบคิวนี้ใช่ไหม?")) {
                const db = getDB();
                db.seller = db.seller.filter(q => q.id !== id);
                saveDB(db);
            }
        }

        function updateProgress(id) {
            if(isCustomer) return;
            const db = getDB();
            const item = db.seller.find(q => q.id === id);
            const newProg = prompt(`แก้ไข % ความคืบหน้าของ ${item.name}:`, item.progress);
            if(newProg !== null) {
                item.progress = Math.min(100, Math.max(0, Number(newProg)));
                if(item.progress === 100) item.status = "✨ เสร็จแล้ว";
                else if(item.progress > 0) item.status = "💜 กำลังทำ";
                saveDB(db);
            }
        }

        function addBuyerJob() {
            if(isCustomer) return;
            const artist = prompt("ชื่อนักวาดที่เราไปจ้าง:");
            const type = prompt("ประเภทงาน:");
            if(artist && type) {
                const db = getDB();
                db.buyer.push({ id: Date.now(), artist, type, status: 'เพิ่งสั่งจ้าง' });
                saveDB(db);
            }
        }

        function switchTab(tab) {
            if(isCustomer) return;
            document.getElementById('seller-section').classList.toggle('hidden', tab !== 'my-jobs');
            document.getElementById('buyer-section').classList.toggle('hidden', tab !== 'hired-jobs');
            document.getElementById('tab-my-jobs').className = tab === 'my-jobs' ? "flex-1 py-1.5 text-xs font-medium rounded-lg bg-pink-400 text-white shadow-sm" : "flex-1 py-1.5 text-xs font-medium rounded-lg text-gray-500 hover:bg-white";
            document.getElementById('tab-hired-jobs').className = tab === 'hired-jobs' ? "flex-1 py-1.5 text-xs font-medium rounded-lg bg-indigo-400 text-white shadow-sm" : "flex-1 py-1.5 text-xs font-medium rounded-lg text-gray-500 hover:bg-white";
        }

        function makeProgressBar(percent) {
            const totalBlocks = 7;
            const filledBlocks = Math.round((percent / 100) * totalBlocks);
            const emptyBlocks = totalBlocks - filledBlocks;
            return '█'.repeat(filledBlocks) + '░'.repeat(emptyBlocks);
        }

        function render() {
            const db = getDB();
            const searchText = document.getElementById('search-input').value.toLowerCase();

            // 1. เรนเดอร์ Artist Note
            const noteContent = document.getElementById('artist-note-content');
            noteContent.innerHTML = db.notes.map(note => `<p class="flex items-center gap-2"><span>${note}</span></p>`).join('');

            // 2. เรนเดอร์ Queue Grid (Seller)
            const queueGrid = document.getElementById('queue-grid');
            const filteredSeller = db.seller.filter(q => q.name.toLowerCase().includes(searchText) || q.queueNum.includes(searchText));

            queueGrid.innerHTML = filteredSeller.map(q => `
                <div class="bg-white rounded-2xl p-4 border-2 border-pink-100 shadow-sm hover:border-pink-200 transition relative space-y-2">
                    ${!isCustomer ? `<button onclick="deleteQueue(${q.id})" class="absolute top-2 right-2 text-gray-300 hover:text-red-400 text-xs"><i class="fa-solid fa-xmark"></i></button>` : ''}
                    
                    <div class="text-xs font-semibold text-pink-400">Queue #${q.queueNum}</div>
                    <div class="font-bold text-gray-800 text-sm truncate">${q.name}</div>
                    <div class="text-xs text-gray-400">${q.type}</div>
                    
                    <div onclick="updateProgress(${q.id})" class="${!isCustomer ? 'cursor-pointer hover:bg-pink-50 p-1 rounded' : ''}">
                        <div class="text-[10px] font-mono tracking-tighter text-pink-400">${makeProgressBar(q.progress)} ${q.progress}%</div>
                    </div>

                    <div class="text-xs font-medium pt-1">${q.status}</div>
                </div>
            `).join('');

            // 3. เรนเดอร์ Buyer List
            const buyerList = document.getElementById('buyer-list');
            buyerList.innerHTML = db.buyer.map(b => `
                <div class="bg-white p-3 rounded-xl border border-indigo-100 text-xs flex justify-between items-center">
                    <div>
                        <div class="font-bold text-gray-800">${b.artist}</div>
                        <div class="text-gray-400">${b.type}</div>
                    </div>
                    <span class="bg-indigo-50 text-indigo-600 px-2 py-1 rounded-md font-medium">${b.status}</span>
                </div>
            `).join('');

            // สลับโหมด Admin vs Customer
            if (isCustomer) {
                document.getElementById('admin-tools').style.display = 'none';
                document.getElementById('admin-tabs').style.display = 'none';
                document.getElementById('admin-add-btn').style.display = 'none';
                document.getElementById('admin-edit-note-btn').style.display = 'none';
                document.getElementById('buyer-section').style.display = 'none';
                document.getElementById('customer-badge').classList.remove('hidden');
                document.getElementById('seller-section').classList.remove('hidden');
            } else {
                document.getElementById('admin-tools').style.display = 'flex';
                document.getElementById('admin-tabs').style.display = 'flex';
                document.getElementById('admin-add-btn').style.display = 'block';
                document.getElementById('admin-edit-note-btn').style.display = 'block';
                document.getElementById('customer-badge').classList.add('hidden');
            }
        }

        render();
    </script>
</body>
</html>
